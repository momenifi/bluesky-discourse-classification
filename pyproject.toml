[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bluesky-discourse-classification"
version = "0.1.0"
description = "Reproducible classification of scholarly discourse on Bluesky"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["scikit-learn==1.8.0"]

[tool.setuptools.packages.find]
where = ["src"]
